<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZNEIN — Nein.</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #111;
            color: #eee;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            overflow: hidden;
        }

        .container {
            text-align: center;
            padding: 40px;
        }

        .logo {
            font-size: clamp(5rem, 18vw, 14rem);
            font-weight: 900;
            letter-spacing: -0.08em;
            line-height: 0.8;
            color: #fff;
            text-shadow:
                8px 8px 0 #d00,
                16px 16px 0 #111;
            animation: nein 1.5s infinite alternate ease-in-out;
        }

        .subtitle {
            margin-top: 45px;
            font-size: 1.5rem;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            color: #888;
        }

        .translation {
            margin-top: 15px;
            font-size: 1rem;
            color: #555;
        }

        .translation span {
            color: #d00;
            font-weight: 700;
        }

        .button {
            margin-top: 50px;
            padding: 15px 35px;
            border: 2px solid #d00;
            background: transparent;
            color: #fff;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
        }

        .button:hover {
            background: #d00;
            transform: scale(1.05);
        }

        .nope {
            position: fixed;
            bottom: 20px;
            width: 100%;
            text-align: center;
            color: #333;
            font-size: 0.75rem;
            letter-spacing: 0.15em;
        }

        @keyframes nein {
            from {
                transform: rotate(-1deg);
            }
            to {
                transform: rotate(1deg);
            }
        }
    </style>
</head>

<body>

    <main class="container">
        <div class="logo">ZNEIN</div>

        <div class="subtitle">
            Absolutely not.
        </div>

        <div class="translation">
            <span>NEIN</span>
        </div>

        <button class="button" onclick="sayNein()">
            Click for approval
        </button>
    </main>

    <div class="nope">
        ERROR 403 — REQUEST DENIED
    </div>

    <script>
        function sayNein() {
            const responses = [
                "Nein.",
                "Nein nein nein.",
                "Absolutely nein.",
                "Das ist nicht möglich.",
                "You have been ZNEIN'd.",
                "Denied. 🇩🇪",
                "Nein™",
                "The answer is still nein.",
                "I regret to inform you: nein.",
                "404: Yes not found."
            ];

            const message =
                responses[Math.floor(Math.random() * responses.length)];

            alert(message);
        }
    </script>

</body>
</html>
