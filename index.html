<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZNEIN — Nein.</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #111;
            color: #eee;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            overflow: hidden;
        }

        .container {
            text-align: center;
            padding: 40px;
        }

        .logo {
            font-size: clamp(5rem, 18vw, 14rem);
            font-weight: 900;
            letter-spacing: -0.08em;
            line-height: 0.8;
            color: #fff;
            text-shadow:
                8px 8px 0 #1e6fff,
                16px 16px 0 #111;
            animation: nein 1.5s infinite alternate ease-in-out;
        }

        .subtitle {
            margin-top: 45px;
            font-size: 1.5rem;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            color: #888;
        }

        .translation {
            margin-top: 15px;
            font-size: 1rem;
            color: #555;
        }

        .translation span {
            color: #1e6fff;
            font-weight: 700;
        }

        .button {
            margin-top: 50px;
            padding: 15px 35px;
            border: 2px solid #1e6fff;
            background: transparent;
            color: #fff;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
        }

        .button:hover {
            background: #1e6fff;
            transform: scale(1.05);
        }

        .nope {
            position: fixed;
            bottom: 20px;
            width: 100%;
            text-align: center;
            color: #333;
            font-size: 0.75rem;
            letter-spacing: 0.15em;
        }

        .modal {
            border: 2px solid #d00;
            background: #111;
            color: #fff;
            padding: 40px 50px;
            text-align: center;
            max-width: min(90vw, 480px);
            box-shadow: 8px 8px 0 #d00;
        }

        .modal::backdrop {
            background: rgba(0, 0, 0, 0.75);
        }

        .modal[open] {
            animation: slam 0.25s ease-out;
        }

        .modal-title {
            font-size: 0.75rem;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            color: #d00;
            margin: 0;
        }

        .modal-message {
            margin: 20px 0 0;
            font-size: 2rem;
            font-weight: 900;
        }

        .modal .button {
            margin-top: 30px;
            border-color: #d00;
        }

        .modal .button:hover {
            background: #d00;
        }

        @keyframes slam {
            from {
                transform: scale(1.4);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        @keyframes nein {
            from {
                transform: rotate(-1deg);
            }
            to {
                transform: rotate(1deg);
            }
        }
    </style>
</head>

<body>

    <main class="container">
        <div class="logo">ZNEIN</div>

        <div class="subtitle">
            Absolutely not.
        </div>

        <div class="translation">
            <span>NEIN</span>
        </div>

        <button class="button" onclick="sayNein()">
            Click for approval
        </button>
    </main>

    <div class="nope">
        ERROR 403 — REQUEST DENIED
    </div>

    <dialog class="modal" id="neinModal" aria-labelledby="neinTitle">
        <p class="modal-title" id="neinTitle">Request Denied</p>
        <p class="modal-message" id="neinMessage"></p>
        <form method="dialog">
            <button class="button" autofocus>OK (still nein)</button>
        </form>
    </dialog>

    <script>
        function sayNein() {
            const responses = [
                "Nein.",
                "Nein nein nein.",
                "Absolutely nein.",
                "Das ist nicht möglich.",
                "You have been ZNEIN'd.",
                "Denied. 🇩🇪",
                "Nein™",
                "The answer is still nein.",
                "I regret to inform you: nein.",
                "404: Yes not found."
            ];

            const message =
                responses[Math.floor(Math.random() * responses.length)];

            document.getElementById("neinMessage").textContent = message;
            document.getElementById("neinModal").showModal();
        }

        // Close when clicking the backdrop
        document.getElementById("neinModal").addEventListener("click", (e) => {
            const r = e.currentTarget.getBoundingClientRect();
            const outside = e.clientX < r.left || e.clientX > r.right ||
                            e.clientY < r.top || e.clientY > r.bottom;
            if (outside) e.currentTarget.close();
        });
    </script>

</body>
</html>
